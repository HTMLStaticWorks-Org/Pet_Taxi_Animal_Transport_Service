<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawVoyage | Sign Up</title>
    <meta name="description"
        content="Create your PawVoyage pet owner account to book safe rides, track live trips, and manage passes.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
</head>

<body class="auth-page">

    <!-- Floating preference toggles -->
    <div class="auth-topbar">
        <button class="icon-btn theme-toggle" aria-label="Toggle Dark Mode" title="Toggle dark mode">
            <i class="ph ph-moon"></i>
        </button>
        <button class="icon-btn rtl-toggle" aria-label="Toggle RTL" title="Toggle Right-to-Left">
            <i class="ph ph-arrows-left-right"></i>
        </button>
    </div>

    <main class="auth-card auth-card--wide">
        <a href="index.html" class="logo auth-logo">
            <i class="ph-fill ph-paw-print"></i> PawVoyage
        </a>

        <h1 class="auth-title">Join PawVoyage</h1>
        <p class="auth-subtitle">Create a pet owner account to book safe rides and track every journey</p>

        <!-- Points at dashboard.html to simulate a successful sign-up -->
        <form class="needs-validation" novalidate action="dashboard.html" method="GET">

            <div class="field">
                <label class="field-label" for="reg-name">Pet owner name</label>
                <div class="field-input-wrap">
                    <input id="reg-name" name="name" type="text" class="form-control" required placeholder=""
                        autocomplete="name">
                </div>
                <div class="error-message">Please tell us your name</div>
            </div>

            <div class="field">
                <label class="field-label" for="reg-email">Email address</label>
                <div class="field-input-wrap">
                    <input id="reg-email" name="email" type="email" class="form-control" required placeholder=""
                        autocomplete="email">
                </div>
                <div class="error-message">Enter a valid email address</div>
            </div>

            <div class="field">
                <label class="field-label" for="reg-password">Password</label>
                <div class="field-input-wrap">
                    <input id="reg-password" name="password" type="password" class="form-control" required minlength="8"
                        placeholder="" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-password-toggle aria-label="Show password">
                        <i class="ph ph-eye"></i>
                    </button>
                </div>
                <div class="error-message">Use at least 8 characters</div>
            </div>

            <div class="field">
                <label class="field-label" for="reg-confirm">Confirm password</label>
                <div class="field-input-wrap">
                    <input id="reg-confirm" name="confirm_password" type="password" class="form-control" required
                        minlength="8" placeholder="" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-password-toggle aria-label="Show password">
                        <i class="ph ph-eye"></i>
                    </button>
                </div>
                <div class="error-message">Passwords must match</div>
            </div>

            <div class="field">
                <label class="checkbox-wrap auth-terms">
                    <input type="checkbox" id="terms" required>
                    <span>I have read and agree to the <a href="#" class="link-brand">Terms &amp; Conditions</a> and the
                        <a href="#" class="link-brand">Pet Transport Agreement</a>.</span>
                </label>
                <div class="error-message">You must accept the transport agreement to continue</div>
            </div>

            <button type="submit" class="btn btn-primary btn-full btn-lg">Sign Up</button>
        </form>

        <div class="auth-divider">or</div>

        <div class="auth-socials">
            <button type="button" class="btn btn-social btn-full">
                <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                    <path fill="#EA4335"
                        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                    <path fill="#4285F4"
                        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                    <path fill="#FBBC05"
                        d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.97-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z" />
                    <path fill="#34A853"
                        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                </svg>
                Continue with Google
            </button>
            <button type="button" class="btn btn-social btn-full">
                <i class="ph-fill ph-apple-logo" style="font-size: 1.25rem;"></i>
                Continue with Apple
            </button>
        </div>

        <p class="auth-alt">Already have an account? <a href="login.html" class="link-brand">Login here</a></p>

    </main>

    <script src="assets/js/main.js"></script>
</body>

</html>
